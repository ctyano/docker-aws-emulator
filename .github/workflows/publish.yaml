name: Build and publish AWS Emulator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 21 * * 5' # Saturday 06:00 JST
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve AWS Emulator LTS version
        id: release
        run: |
          version=$(./scripts/fetch-rpms.sh --resolve)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check published version
        id: existing
        if: github.event_name == 'schedule'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Download architecture packages
        if: steps.existing.outputs.skip != 'true'
        run: |
          ./scripts/fetch-rpms.sh
          test "$(sed -n 's/^VERSION=//p' packages/release.env)" = '${{ steps.release.outputs.version }}'

      - name: Build and publish multi-architecture image
        if: steps.existing.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.release.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            AWS_EMULATOR_VERSION=${{ steps.release.outputs.version }}
          provenance: mode=max
